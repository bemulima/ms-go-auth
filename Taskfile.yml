version: '3'

dotenv: ['.env']

vars:
  COMPOSE_FILE: '{{.COMPOSE_FILE | default "docker-compose.yml"}}'
  COMPOSE_PROJECT_NAME: '{{.COMPOSE_PROJECT_NAME | default "ms-go-auth"}}'
  DB_SERVICE: '{{.DB_SERVICE | default "postgres"}}'
  MIGRATION_ENV: '{{.MIGRATION_ENV | default "production"}}'

env:
  COMPOSE_FILE: '{{.COMPOSE_FILE}}'
  COMPOSE_PROJECT_NAME: '{{.COMPOSE_PROJECT_NAME}}'
  DB_SERVICE: '{{.DB_SERVICE}}'
  MIGRATION_ENV: '{{.MIGRATION_ENV}}'

tasks:
  migrate-up:
    desc: Apply ordered auth migrations; local seeds require MIGRATION_ENV=local or dev
    cmds:
      - bash ./scripts/migrate.sh up

  migrate-down:
    desc: Roll back applied auth migrations in reverse order
    cmds:
      - bash ./scripts/migrate.sh down

  migrate-status:
    desc: Show applied, pending, excluded, and checksum-mismatched migrations
    cmds:
      - bash ./scripts/migrate.sh status

  migration-integration-test:
    desc: Verify migrations and environment-gated seeds against disposable Postgres databases
    cmds:
      - bash ./test/integration/migration_lifecycle_test.sh

  run:
    desc: Run service locally
    cmds:
      - go run ./cmd/ms-go-auth

  test:
    desc: Run tests
    cmds:
      - go test ./...

  lint:
    desc: Run linter
    cmds:
      - golangci-lint run ./...
