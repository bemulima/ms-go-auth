schema_version: 1
layers:
  domain: internal/domain
  usecase: internal/usecase
  ports_and_adapters: internal/adapters
  composition_root: internal/app
ownership:
  auth: [credentials, auth identities, OAuth transactions, JWT issuance and verification, refresh sessions]
  external: [user profiles, roles and permissions, verification-code transport]
invariants:
  - OAuth state is one-time and PKCE-protected.
  - Refresh rotation revokes the consumed session before issuing a replacement.
  - Password and token secrets never cross response or logging boundaries.
