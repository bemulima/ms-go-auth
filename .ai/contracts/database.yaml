schema_version: 1
documentation: docs/database-contract.md
owner: ms-go-auth
tables: [auth_user, auth_identity, auth_refresh_token, auth_oauth_transaction, auth_signup_completion]
migrations: [0001_init, 0002_seed_auth_users, 0003_oauth_flow, 0004_signup_completion, 0005_email_verified]
refresh_rotation:
  isolation: principal_lock_then_conditional_active_session_consume_and_replacement_insert_in_one_postgres_transaction
  replay: rejected
  lost_response: unknown_outcome_requires_reauthentication_no_receipt
  logout_race: old_session_linearized_stale_logout_fails_if_refresh_wins
signup_completion:
  operation_key: [normalized_email, workflow_specific_proof_fingerprint]
  proof_fingerprints:
    legacy_signup: length_framed_SHA256_email_code
    email_registration: HMAC_registration_operation_grant
  reserved_identity: [operation_id, principal_id]
  states: [pending, verified, completed]
  frozen_receipt: [operation_id, email, password_hash, receipt_expires_at]
  principal_ownership: transactionally_committed_principal_created
  terminal_transition: atomic_verified_to_completed_before_one_token_attempt
  code_terminal_cas: requires_unexpired_original_hard_ttl_receipt
  password_repair: exact_owned_verified_principal_credential_required
  rollback: refuses_any_retained_operation

tarantool_verification:
  owner: ms-go-auth
  source: scripts/tarantool
  ledger: ms_go_tarantool_schema_migrations
  migrations: [001_initial_schema, 002_make_secondary_indexes_nonunique, 003_signup_consumption_receipts, 004_atomic_verification_functions, 005_email_code_grants]
  spaces: [user_signup_space, user_signup_consumption_receipts, user_email_change, user_email_change_code_lookup, user_password_reset, auth_email_code, auth_email_limit, auth_email_grant]
  runtime: authenticated_named_call_no_eval
  cleanup: single_lua_fiber_verification_only
  legacy_retention: user_and_sandbox_unchanged_no_cleanup
  sandbox_store: separate_ms_go_sandbox_boundary

email_code:
  account_confirmation_column: auth_user.email_verified
  grant: purpose_and_email_bound_single_use_HMAC
  registration: verified_grant_before_principal_creation
  reset: password_update_and_session_revocation_in_one_transaction
