schema_version: 1
commands:
  - {name: notification-recipient-targeted, run: 'go test -count=1 ./internal/usecase ./internal/transport/http/private ./cmd/ms-go-auth -run "^TestNotificationRecipient"', requires_approval: false, risk: verification}
  - {name: agent-policy-regression, run: 'PYTHONDONTWRITEBYTECODE=1 python3 test/unit/agent_policy_test.py', requires_approval: false, risk: verification}
  - {name: agent-policy, run: ./scripts/check-agent-policy.sh, requires_approval: false, risk: verification}
  - {name: format-check, run: 'test -z "$(gofmt -l $(git ls-files ''*.go''))"', requires_approval: false, risk: verification}
  - {name: vet, run: go vet ./..., requires_approval: false, risk: verification}
  - {name: test, run: go test ./..., requires_approval: false, risk: verification}
  - {name: mentor-composition-targeted, run: 'go test -count=1 ./cmd/ms-go-auth -run "^TestMentorComposition"', requires_approval: false, risk: verification}
  - {name: mentor-runtime-targeted, run: 'go test -count=1 ./config ./cmd/ms-go-auth -run "^(TestMentorRuntime|TestMentorComposition|TestApplyDatabaseMigrationsSkipsEveryStatementWhenDisabled)"', requires_approval: false, risk: verification}
  - {name: mentor-runtime-race, run: 'go test -race -count=1 ./config ./cmd/ms-go-auth -run "^TestMentorRuntime"', requires_approval: false, risk: verification}
  - {name: mentor-runtime-vet, run: 'go vet ./config ./cmd/ms-go-auth', requires_approval: false, risk: verification}
  - {name: mentor-runtime-build, run: 'go build -buildvcs=false -o .cache/mentor-runtime-auth ./cmd/ms-go-auth', requires_approval: false, risk: verification}
  - {name: mentor-http-authority-targeted, run: 'go test -count=1 ./internal/usecase ./internal/transport/http/private ./internal/infrastructure/persistence/postgres -run "^(TestMentorLiveSession|TestMentorHTTPAuthority|TestMentorSessionReader|TestMentorRoleDecision)"', requires_approval: false, risk: verification}
  - {name: mentor-http-authority-race, run: 'go test -race -count=1 ./internal/usecase ./internal/transport/http/private ./internal/infrastructure/persistence/postgres -run "^(TestMentorLiveSession|TestMentorHTTPAuthority|TestMentorSessionReader|TestMentorRoleDecision)"', requires_approval: false, risk: verification}
  - {name: mentor-source-tests-without-sql, run: 'env -u LC08_AUTH_HTTP_HARNESS -u LC08_AUTH_ATOMIC_TEST_DSN -u T16_AUTH_REPOSITORY_INTEGRATION go test -count=1 ./...', requires_approval: false, risk: verification}
  - {name: mentor-role-conformance, run: 'node scripts/test-mentor-role-conformance.cjs --rbac /absolute/path/to/ms-go-rbac', requires_approval: false, risk: verification}
  - {name: mentor-owner-conformance, run: 'node scripts/test-mentor-owner-conformance.cjs --rbac /absolute/path/to/ms-go-rbac --mentor /absolute/path/to/ms-go-mentor', requires_approval: false, risk: verification}
  - {name: signup-contract-regression, run: 'go test -tags=integration ./test/integration -run "TestT16ActualSignupRecovery|TestT17StudentProvisioningHTTPContract"', requires_approval: false, risk: disposable-integration-test}
  - {name: verification-real-store, run: 'go test -tags=integration ./test/integration -run TestActualDirectVerification -count=1', requires_approval: false, risk: disposable-integration-test}
  - {name: verification-cleanup-observation, run: 'go test -tags=integration ./test/integration -run TestActualVerificationCleanup -count=1', requires_approval: false, risk: disposable-integration-test}
  - {name: migration-integration-test, run: task migration-integration-test, requires_approval: false, risk: disposable-integration-test}
  - {name: mcp-code-postgres-integration, run: 'go test -race -count=1 -timeout=3m -run "^TestMCPExternalCodePostgres$" ./internal/infrastructure/persistence/postgres', requires_approval: false, risk: disposable-integration-test}
  - {name: lint, run: golangci-lint run ./..., requires_approval: false, risk: verification}
  - {name: run, run: go run ./cmd/ms-go-auth, requires_approval: true, risk: lifecycle}
  - {name: migrate-up, run: task migrate-up, requires_approval: true, risk: database-write}
  - {name: migrate-status, run: task migrate-status, requires_approval: true, risk: database-read}
  - {name: migrate-down, run: task migrate-down, requires_approval: true, risk: destructive-database-write}
  - {name: migrate-native, run: 'task migrate:native', requires_approval: true, risk: database-write}
  - {name: migrate-status-native, run: 'task migrate-status:native', requires_approval: true, risk: database-read}
  - {name: run-native, run: 'task run:native', requires_approval: true, risk: lifecycle}

  - {name: external-google-boundary, run: 'AUTH_SMOKE_SERVE_EXTERNAL_ONLY=true go test -tags=integration ./test/integration -run "^TestAuthSmokeServe$" -count=1 -timeout=35m', requires_approval: true, risk: disposable-integration-fixture}
