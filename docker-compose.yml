services:
  ms-go-auth:
    container_name: ms-go-auth
    image: golang:1.24-alpine
    working_dir: /app
    command: go run ./cmd/ms-go-auth
    env_file:
      - .env
    environment:
      AUTH_DB_HOST: postgres
      AUTH_DB_PORT: "5432"
      NATS_URL: nats://nats:4222
      TARANTOOL_HOST: ${TARANTOOL_HOST:-identity-store}
      TARANTOOL_PORT: "${TARANTOOL_PORT:-3301}"
      TARANTOOL_USER: ${TARANTOOL_USER:?configured identity principal required}
      TARANTOOL_PASSWORD: ${TARANTOOL_PASSWORD:?configured identity credential required}
    volumes:
      - ./:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
    networks: [default, ms-net]
    restart: unless-stopped

  postgres:
    container_name: ms-go-auth-postgres
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${AUTH_POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:-app}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-app_password}
      POSTGRES_DB: ${AUTH_DB_NAME:-authdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
  go-mod-cache:
  go-build-cache:

networks:
  ms-net:
    external: true
