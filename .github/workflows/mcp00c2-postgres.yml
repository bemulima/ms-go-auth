name: MCP-00C2/C3C PostgreSQL repository gate

on:
  pull_request:
    paths:
      - 'internal/infrastructure/persistence/postgres/mcp_external_code_repository*'
      - 'internal/infrastructure/persistence/postgres/mcp_external_auth_grant_repository*'
      - 'migrations/0006_mcp_external_codes*'
      - '.github/workflows/mcp00c2-postgres.yml'
      - '.ai/commands.yaml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Same immutable image as the existing Auth migration provisioner.
        image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: codeci
          POSTGRES_DB: mcp_external_codes_ci_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U codeci -d mcp_external_codes_ci_test"
          --health-interval 1s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Isolated live GORM / PostgreSQL code and Auth grant readback tests
        env:
          MCP_AUTH_CODE_PG_ENABLE: 'true'
          MCP_AUTH_CODE_PG_DSN: postgres://codeci@127.0.0.1:5432/mcp_external_codes_ci_test?sslmode=disable
        run: go test -race -count=1 -timeout=3m -run '^TestMCPExternalCodePostgres$' ./internal/infrastructure/persistence/postgres
